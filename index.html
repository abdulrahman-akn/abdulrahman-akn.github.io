<!DOCTYPE html>
<html lang="ar" dir="rtl" data-t="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عبد الرحمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-ui" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap">
<link id="font-scheherazade" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&amp;display=swap">
<style id="css">
  :root, :root[data-t="green"] {
    --bg:#E6EDE4; --sheet:#D5E2D2; --ink:#1F3A33; --muted:#5E766C; --accent:#4D7C6B; --line:rgba(31,58,51,.18); --danger:#A8402F;
    --f-display:"Scheherazade New","Amiri",serif; --f-body:"Scheherazade New","Amiri",serif; --f-ui:"Tajawal",sans-serif;
    --fs:1.25rem; --title-weight:700; --hero-size:clamp(2.2rem,10vw,3.1rem); --hero-lh:1.7; --hero-weight:400; --hero-align:center;
  }
  :root[data-t="dusk"] {
    --bg:#F3ECEE; --sheet:#EADDE1; --ink:#2B2233; --muted:#75677C; --accent:#8A4F6B; --line:rgba(43,34,51,.16);
    --f-display:"Aref Ruqaa","Amiri",serif; --f-body:"Amiri","Traditional Arabic",serif; --fs:1.2rem; --hero-size:clamp(2.2rem,10vw,3rem); --hero-weight:700;
  }
  :root[data-t="night"] {
    --bg:#151B33; --sheet:#1F2748; --ink:#F1EADB; --muted:#A9ADC2; --accent:#D8BC82; --line:rgba(241,234,219,.2); --danger:#E59A8A;
    --f-display:"Reem Kufi","Noto Naskh Arabic",sans-serif; --f-body:"Noto Naskh Arabic","Amiri",serif; --fs:1.1rem; --title-weight:600;
    --hero-size:clamp(1.9rem,9vw,2.7rem); --hero-lh:1.8; --hero-weight:600;
  }
  :root[data-t="bold"] {
    --bg:#FAFAF7; --sheet:#EFEFE8; --ink:#111111; --muted:#5C5C5C; --accent:#2540D9; --line:rgba(17,17,17,.2);
    --f-display:"Lalezar","Tajawal",sans-serif; --f-body:"Amiri","Traditional Arabic",serif; --fs:1.2rem; --title-weight:400;
    --hero-size:clamp(2.8rem,15vw,4.4rem); --hero-lh:1.3; --hero-weight:400; --hero-align:start;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-t="green"] { --bg:#16221E; --sheet:#20302A; --ink:#E3EDE4; --muted:#9AB1A6; --accent:#8FC1AE; --line:rgba(227,237,228,.2); --danger:#E59A8A; }
    :root[data-t="dusk"]  { --bg:#1E1824; --sheet:#2A2232; --ink:#EBDFE7; --muted:#A596AD; --accent:#D99DB8; --line:rgba(235,223,231,.18); --danger:#E59A8A; }
    :root[data-t="bold"]  { --bg:#0F1013; --sheet:#1A1C22; --ink:#F3F3EE; --muted:#A0A0A8; --accent:#8CA0FF; --line:rgba(243,243,238,.2); --danger:#E59A8A; }
  }

  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  html { font-size:calc(100% * var(--scale,1)); scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem); -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:calc(var(--fs) * var(--fscale,1)); line-height:2; }
  body.admin main { padding-bottom:6.5rem; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .wrap { max-width:34rem; margin:0 auto; padding:0 1.4rem; }
  [hidden] { display:none !important; }

  .topbar { padding-top:1.3rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .topbar .name { touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer; margin:0; font-family:var(--f-display); font-weight:var(--title-weight); font-size:1.3em; line-height:1.6; }
  .badge { font-family:var(--f-ui); font-size:.8rem; padding:.1rem .7rem; border:1px solid var(--accent); border-radius:999px; color:var(--accent); line-height:1.8; }

  header.hero { text-align:var(--hero-align); padding:2.4rem 0 1.6rem; }
  header.hero h1 { margin:0; font-family:var(--f-display); font-weight:var(--hero-weight); font-size:var(--hero-size); line-height:var(--hero-lh); animation:rise .9s ease-out both; }
  header.hero h1 span { display:block; color:var(--accent); }
  .bio { margin:.8rem 0 0; color:var(--muted); font-family:var(--f-ui); font-size:.95rem; line-height:1.9; }
  @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce) { header.hero h1 { animation:none; } }

  nav.tabs { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:.6rem 0; }
  .tabsbar { display:flex; gap:.6rem; overflow-x:auto; scrollbar-width:none; }
  .tabsbar::-webkit-scrollbar { display:none; }
  .tab { flex:1 0 auto; min-height:46px; padding:0 1.1rem; white-space:nowrap; border-radius:6px; font-family:var(--f-ui); font-size:1rem; font-weight:500; border:1px solid var(--accent); color:var(--ink); }
  .tab[aria-selected="true"] { background:var(--accent); color:var(--bg); }

  .chips { display:flex; gap:.5rem; justify-content:center; padding:.5rem 0 0; font-family:var(--f-ui); }
  .chip { min-height:44px; padding:0 1.1rem; border-radius:999px; border:1px solid var(--line); font-size:.9rem; color:var(--muted); }
  .chip[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:500; }

  main { padding-bottom:2.5rem; }
  .empty { text-align:center; color:var(--muted); padding:2.5rem 0; font-family:var(--f-ui); font-size:.95rem; }

  .entry, .letter { font-family:var(--f-body); }
  .entry { padding:2.2rem 0 1.2rem; border-bottom:1px solid var(--line); scroll-margin-top:4.5rem; }
  .entry:last-child { border-bottom:0; }
  .entry h2 { margin:0; text-align:center; font-family:var(--f-display); font-weight:var(--title-weight); font-size:1.45em; line-height:1.6; }
  .meta { display:flex; justify-content:center; gap:.9rem; margin:0 0 1.1rem; font-size:.85em; color:var(--accent); }
  .meta .date { color:var(--muted); }
  .poem p { margin:0; text-align:center; font-size:1.2em; line-height:2.1; }
  .prose p { margin:0 0 1rem; font-size:1.12em; line-height:2.05; text-align:start; }
  .clamped { max-height:11rem; overflow:hidden; -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent); mask-image:linear-gradient(to bottom,#000 55%,transparent); }
  .more { display:block; margin:.2rem auto 0; min-height:44px; padding:0 1rem; font-family:var(--f-ui); font-size:.9rem; color:var(--accent); }
  .flash { animation:flash 1.6s ease-out; }
  @keyframes flash { from{outline:2px solid var(--accent); outline-offset:6px} to{outline:2px solid transparent; outline-offset:6px} }

  .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:.3rem; margin-top:.6rem; }
  .actions button { min-height:44px; padding:0 .9rem; font-family:var(--f-ui); font-size:.9rem; color:var(--accent); }
  .actions button.owner-btn { color:var(--muted); }
  .actions button.danger { color:var(--danger); }

  .letter { position:relative; margin:2.6rem 0; padding:2.4rem 1.5rem 1rem; background:var(--sheet); border-radius:4px; scroll-margin-top:4.5rem; }
  .letter::before { content:""; position:absolute; top:-9px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:var(--accent); }
  .letter .to { margin:0 0 .8rem; font-family:var(--f-display); font-weight:var(--title-weight); font-size:1.4em; line-height:1.7; color:var(--accent); }
  .letter .body p { margin:0 0 .9rem; font-size:1.08em; line-height:2.05; }
  .letter .from { margin:.4rem 0 0; text-align:end; color:var(--muted); font-size:.95em; }
  .letter .date { display:block; font-size:.85em; }
  .letter .actions { justify-content:flex-start; }

  .sample-note { text-align:center; color:var(--muted); font-family:var(--f-ui); font-size:.85rem; margin:1.6rem 0 0; }

  .adminbar { position:fixed; left:0; right:0; bottom:0; z-index:15; display:flex; gap:.4rem; padding:.5rem .8rem calc(.5rem + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); font-family:var(--f-ui); }
  .adminbar button { position:relative; flex:1; min-height:46px; border-radius:6px; font-size:.95rem; border:1px solid var(--bg); color:var(--bg); }
  .adminbar button.primary { background:var(--accent); border-color:var(--accent); }
  .dot { position:absolute; top:6px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--danger); }
  .admin-btn { min-height:44px; padding:0 1rem; border:1px solid var(--accent); border-radius:6px; font-family:var(--f-ui); font-size:.85rem; color:var(--accent); }

  .sheet { position:fixed; inset:0; z-index:25; background:var(--bg); overflow-y:auto; padding:calc(1rem + env(safe-area-inset-top,0px)) 0 calc(2.5rem + env(safe-area-inset-bottom,0px)); font-family:var(--f-ui); }
  .sheet h3 { margin:1.2rem 0 .3rem; font-family:var(--f-display); font-size:1.4em; font-weight:var(--title-weight); }
  .sheet h4 { margin:1.8rem 0 .2rem; font-family:var(--f-ui); font-size:.95rem; color:var(--accent); font-weight:700; }
  .sheet .head { display:flex; align-items:center; justify-content:space-between; }
  .field { margin:.8rem 0; font-family:var(--f-ui); }
  .field label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:.2rem; }
  .field input, .field select, .field textarea { width:100%; min-height:46px; padding:.5rem .8rem; font:inherit; font-size:1rem; color:var(--ink); background:var(--sheet); border:1px solid var(--line); border-radius:6px; }
  .field textarea { min-height:12rem; font-family:var(--f-body); font-size:1.25rem; line-height:2; resize:vertical; }
  .field textarea.short { min-height:5rem; font-family:var(--f-ui); font-size:1rem; line-height:1.8; }
  .check { display:flex; align-items:center; gap:.7rem; min-height:44px; font-family:var(--f-ui); font-size:1rem; }
  .check input { width:22px; height:22px; accent-color:var(--accent); }
  .btn-row { display:flex; gap:.6rem; margin-top:1rem; font-family:var(--f-ui); flex-wrap:wrap; }
  .btn { flex:1; min-width:9rem; min-height:48px; border-radius:6px; border:1px solid var(--accent); font-size:1rem; font-weight:500; }
  .btn.primary { background:var(--accent); color:var(--bg); }
  .btn.danger { border-color:var(--danger); color:var(--danger); }
  .btn[disabled] { opacity:.6; }
  .err { color:var(--danger); font-family:var(--f-ui); font-size:.9rem; min-height:1.4rem; margin:.4rem 0 0; }
  .hint, .note { color:var(--muted); font-family:var(--f-ui); font-size:.88rem; margin:.3rem 0; line-height:1.9; }
  .steps { font-family:var(--f-ui); font-size:.95rem; line-height:2; padding-inline-start:1.3rem; margin:.6rem 0; }
  .themes { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.5rem; font-family:var(--f-ui); }
  .theme { min-height:64px; padding:.5rem; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:.9rem; }
  .theme[aria-pressed="true"] { border:2px solid var(--accent); }
  .theme .sw { display:inline-block; width:16px; height:16px; border-radius:50%; border:1px solid var(--line); margin:0 2px; vertical-align:middle; }

  .fonts { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.4rem; }
  .fopt { display:flex; flex-direction:column; align-items:flex-start; width:100%; min-height:64px; padding:.4rem .7rem; border:1px solid var(--line); border-radius:8px; text-align:start; }
  .fopt[aria-pressed="true"] { border:2px solid var(--accent); }
  .fname { font-family:var(--f-ui); font-size:.78rem; color:var(--muted); line-height:1.6; }
  .fsample { font-size:1.05rem; line-height:1.8; color:var(--ink); }
  .secrow { display:flex; gap:.4rem; align-items:center; margin:.5rem 0; }
  .secrow input { flex:1; min-width:0; min-height:46px; padding:.5rem .8rem; font:inherit; font-size:1rem; color:var(--ink); background:var(--sheet); border:1px solid var(--line); border-radius:6px; }
  .mini { min-height:44px; min-width:44px; padding:0 .6rem; font-family:var(--f-ui); font-size:.85rem; color:var(--accent); border:1px solid var(--line); border-radius:6px; }
  .mini.danger { color:var(--danger); }

  .toast { position:fixed; left:50%; bottom:calc(1.4rem + env(safe-area-inset-bottom,0px)); z-index:40; transform:translate(-50%,20px); max-width:90vw; text-align:center; background:var(--ink); color:var(--bg); padding:.3rem 1.2rem; border-radius:999px; font-family:var(--f-ui); font-size:.9rem; line-height:2; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  body.admin .toast { bottom:calc(5rem + env(safe-area-inset-bottom,0px)); }
  .toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div id="root"></div>
<template id="skeleton">
<div class="topbar wrap"><p class="name" id="siteName"></p><span class="badge" id="badge" hidden="">وضع الإدارة</span></div>
<header class="hero wrap"><h1 id="heroTitle"></h1><p class="bio" id="bio" hidden=""></p></header>
<nav class="tabs" aria-label="الأقسام"><div class="wrap tabsbar" role="tablist" id="tabs"></div></nav>
<main class="wrap">
  <div class="chips" id="chips" hidden=""></div>
  <section id="list" role="tabpanel"></section>
  <p class="sample-note" id="sampleNote" hidden="">هذه نصوص تجريبية، سيتم استبدالها بكتاباتك.</p>
</main>

<div class="adminbar" id="adminBar" hidden="">
  <button type="button" id="addBtn">نص جديد</button>
  <button type="button" id="setBtn">الإعدادات</button>
  <button type="button" class="primary" id="pubBtn">نشر<span class="dot" id="dot" hidden=""></span></button>
</div>

<div class="sheet" id="editor" hidden=""><div class="wrap">
  <div class="head"><h3 id="edTitle">نص جديد</h3><button class="admin-btn" id="edClose" type="button">إغلاق</button></div>
  <div class="field"><label for="fSec">القسم</label><select id="fSec"></select></div>
  <div class="field"><label for="fType">النوع</label><select id="fType"><option value="poem">شعر</option><option value="prose">نثر</option><option value="letter">رسالة (على ورقة)</option></select></div>
  <div class="field"><label for="fTitle" id="lTitle">العنوان</label><input id="fTitle" type="text" autocomplete="off"></div>
  <div class="field"><label for="fBody">النص</label><textarea id="fBody"></textarea><p class="hint" id="hBody"></p></div>
  <div class="field" id="rowFrom"><label for="fFrom">التوقيع</label><input id="fFrom" type="text" autocomplete="off" placeholder="من أحدٍ يفهمك"></div>
  <div class="field"><label for="fDate">التاريخ (اكتبه كما تشاء، أو اتركه فارغًا)</label><input id="fDate" type="text" autocomplete="off"></div>
  <h4>خط هذا النص</h4>
  <div class="fonts" id="edFonts"></div>
  <p class="err" id="edErr" role="alert"></p>
  <div class="btn-row"><button class="btn primary" id="edSave" type="button">حفظ</button><button class="btn" id="edCancel" type="button">إلغاء</button></div>
</div></div>

<div class="sheet" id="settings" hidden=""><div class="wrap">
  <div class="head"><h3>الإعدادات</h3><button class="admin-btn" id="setClose" type="button">إغلاق</button></div>
  <h4>الهوية</h4>
  <div class="field"><label for="sName">الاسم (أعلى اليمين)</label><input id="sName" type="text" autocomplete="off"></div>
  <div class="field"><label for="sL1">العبارة، السطر الأول</label><input id="sL1" type="text" autocomplete="off"></div>
  <div class="field"><label for="sL2">العبارة، السطر الثاني (بلون التمييز)</label><input id="sL2" type="text" autocomplete="off"></div>
  <div class="field"><label for="sBio">سطر تعريفي صغير تحت العبارة (اختياري)</label><textarea id="sBio" class="short"></textarea></div>
  <h4>الأقسام</h4>
  <div id="secList"></div>
  <div class="btn-row"><button class="btn" id="secAdd" type="button">إضافة قسم</button></div>
  <h4>التصميم</h4>
  <div class="themes" id="themeList"></div>
  <h4>خط النصوص في الموقع كله</h4>
  <div class="fonts" id="gfBody"></div>
  <h4>خط العناوين والعبارة</h4>
  <div class="fonts" id="gfTitle"></div>
  <div class="field"><label for="sScale">حجم الخط</label><select id="sScale"><option value="0.9">صغير</option><option value="1">متوسط</option><option value="1.12">كبير</option></select></div>
  <h4>العرض</h4>
  <label class="check"><input type="checkbox" id="sDates"> إظهار التواريخ</label>
  <label class="check"><input type="checkbox" id="sShare"> إظهار أزرار النسخ والمشاركة</label>
  <p class="err" id="setErr" role="alert"></p>
  <div class="btn-row"><button class="btn primary" id="setSave" type="button">حفظ</button><button class="btn" id="setCancel" type="button">إلغاء</button></div>
</div></div>

<div class="sheet" id="publish" hidden=""><div class="wrap">
  <div class="head"><h3>نشر التعديلات</h3><button class="admin-btn" id="pubClose" type="button">إغلاق</button></div>
  <p class="note" id="pubStatus"></p>
  <p class="err" id="pubErr" role="alert"></p>
  <ol class="steps">
    <li>اضغط «تنزيل الملف المحدّث» ليُحفظ باسم index.html.</li>
    <li>ارفعه إلى مستودع موقعك على GitHub (Add file ثم Upload files) واستبدل الملف القديم.</li>
    <li>انتظر دقيقة تقريبًا ثم افتح رابط موقعك وحدّث الصفحة.</li>
  </ol>
  <div class="btn-row"><button class="btn primary" id="pubDownload" type="button">تنزيل الملف المحدّث</button><button class="btn" id="pubCopy" type="button">نسخ الكود</button></div>
  <p class="note">افتح وضع الإدارة من متصفح عادي (سفاري أو كروم) وليس من متصفح إنستغرام، لأن التنزيل قد لا يعمل فيه. التعديلات تُحفظ على هذا الجهاز فقط إلى أن تُنشر، ولا يراها الزوار قبل ذلك.</p>
  <h4>خيارات أخرى</h4>
  <div class="btn-row"><button class="btn danger" id="pubDiscard" type="button">تجاهل التعديلات غير المنشورة</button><button class="btn" id="pubExit" type="button">خروج من وضع الإدارة</button><button class="btn" id="pubForget" type="button">حذف مفتاح النشر من الجهاز</button></div>
</div></div>

<div class="sheet" id="token" hidden=""><div class="wrap">
  <div class="head"><h3>تفعيل وضع الإدارة</h3><button class="admin-btn" id="tkClose" type="button">إغلاق</button></div>
  <p class="note">هذه الخطوة لصاحب الموقع فقط، وتتم مرة واحدة على جوالك. أدخل اسم المستودع ومفتاح الوصول من حسابك في GitHub ليتمكن الموقع من نشر تعديلاتك مباشرة.</p>
  <div class="field"><label for="tkRepo">المستودع (اسم_المستخدم/اسم_المستودع)</label><input id="tkRepo" type="text" autocomplete="off" dir="ltr" placeholder="username/my-site"></div>
  <div class="field"><label for="tkInput">مفتاح الوصول (Fine-grained token)</label><input id="tkInput" type="password" autocomplete="off" dir="ltr"></div>
  <p class="err" id="tkErr" role="alert"></p>
  <div class="btn-row"><button class="btn primary" id="tkGo" type="button">تفعيل</button></div>
  <p class="note">يجب أن يكون المفتاح محصورًا بمستودع الموقع فقط، بصلاحية Contents: Read and write. يُحفظ على هذا الجهاز فقط ولا يراه الزوار، ويمكنك إلغاؤه من GitHub في أي وقت.</p>
</div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</template>

    editing = it ? id : null;
    $("edErr").textContent = "";
    $("edTitle").textContent = it ? "تعديل النص" : "نص جديد";
    var sel = $("fSec"); sel.textContent = "";
    state.sections.forEach(function (s) { var o = el("option", null, s.name); o.value = s.id; sel.appendChild(o); });
    var cur = curSection();
    sel.value = it ? it.sec : cur.id;
    if (it) $("fType").value = it.type;
    else {
      var se = state.entries.filter(function (x) { return x.sec === cur.id; });
      $("fType").value = se.length && se.every(function (x) { return x.type === "letter"; }) ? "letter" : "poem";
    }
    $("fTitle").value = it ? it.title : ""; $("fBody").value = it ? it.body.join("\n") : "";
    $("fFrom").value = it && it.from ? it.from : ""; $("fDate").value = it ? (it.date || "") : today();
    edPicker = makePicker($("edFonts"), it ? it.font : "", "خط الموقع الافتراضي");
    syncType(); openSheet("editor");
  }
  $("edSave").addEventListener("click", function () {
    var sec = $("fSec").value, type = $("fType").value, title = $("fTitle").value.trim(), body = lines($("fBody").value), date = $("fDate").value.trim(), from = $("fFrom").value.trim(), font = edPicker ? edPicker.value : "";
    if (!title) { $("edErr").textContent = "اكتب العنوان أولًا."; return; }
    if (!body.length) { $("edErr").textContent = "اكتب النص أولًا."; return; }
    var isNew = !editing;
    mutate(function () {
      var it;
      if (editing) { it = findEntry(editing); if (!it) return; delete it.sample; }
      else { it = { id: uid() }; state.entries.unshift(it); }
      it.sec = sec; it.type = type; it.title = title; it.date = date; it.body = body;
      if (type === "letter") it.from = from; else delete it.from;
      if (font) it.font = font; else delete it.font;
    });
    closeSheets(); tab = sec; filter = "all"; render();
    if (isNew) window.scrollTo({ top: 0 });
    toast("تم الحفظ، اضغط «نشر» لتظهر للزوار");
  });
  $("edClose").addEventListener("click", closeSheets);
  $("edCancel").addEventListener("click", closeSheets);

  function renderThemes() {
    var box = $("themeList"); box.textContent = "";
    THEMES.forEach(function (t) {
      var b = el("button", "theme"); b.type = "button";
      b.setAttribute("aria-pressed", selTheme === t.id ? "true" : "false");
      b.appendChild(el("div", null, t.name));
      var sw = el("div"); t.sw.forEach(function (c) { var s = el("span", "sw"); s.style.background = c; sw.appendChild(s); }); b.appendChild(sw);
      b.addEventListener("click", function () { selTheme = t.id; renderThemes(); });
      box.appendChild(b);
    });
  }
  function renderSections() {
    var box = $("secList"); box.textContent = "";
    wsec.forEach(function (s, i) {
      var row = el("div", "secrow");
      var inp = el("input"); inp.type = "text"; inp.value = s.name; inp.setAttribute("aria-label", "اسم القسم");
      inp.addEventListener("input", function () { s.name = inp.value; });
      row.appendChild(inp);
      var up = el("button", "mini", "أعلى"); up.type = "button"; up.disabled = i === 0;
      up.addEventListener("click", function () { var t = wsec[i - 1]; wsec[i - 1] = wsec[i]; wsec[i] = t; renderSections(); });
      var dn = el("button", "mini", "أسفل"); dn.type = "button"; dn.disabled = i === wsec.length - 1;
      dn.addEventListener("click", function () { var t = wsec[i + 1]; wsec[i + 1] = wsec[i]; wsec[i] = t; renderSections(); });
      var del = el("button", "mini danger", "حذف"); del.type = "button";
      var n = state.entries.filter(function (x) { return x.sec === s.id; }).length, armed = false;
      del.addEventListener("click", function () {
        if (wsec.length <= 1) { toast("يجب أن يبقى قسم واحد على الأقل"); return; }
        if (!armed && n) { armed = true; del.textContent = "سيُحذف " + n + " نص"; setTimeout(function () { armed = false; del.textContent = "حذف"; }, 3000); return; }
        wsec.splice(i, 1); renderSections();
      });
      row.append(up, dn, del);
      box.appendChild(row);
    });
  }
  function openSettings() {
    var s = state.settings; selTheme = s.theme;
    $("setErr").textContent = "";
    $("sName").value = s.name; $("sL1").value = s.line1; $("sL2").value = s.line2; $("sBio").value = s.bio;
    $("sScale").value = String(s.scale); $("sDates").checked = !!s.showDates; $("sShare").checked = !!s.showShare;
    wsec = clone(state.sections); renderSections();
    renderThemes();
    pickBody = makePicker($("gfBody"), s.font, "حسب التصميم");
    pickTitle = makePicker($("gfTitle"), s.titleFont, "حسب التصميم");
    openSheet("settings");
  }
  $("secAdd").addEventListener("click", function () {
    wsec.push({ id: uid(), name: "قسم جديد" }); renderSections();
    var inputs = $("secList").querySelectorAll("input"); var last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
  });
  $("setSave").addEventListener("click", function () {
    var n = $("sName").value.trim(), a = $("sL1").value.trim();
    if (!n || !a) { $("setErr").textContent = "الاسم والسطر الأول مطلوبان."; return; }
    var keep = {}, secs = wsec.map(function (s) { keep[s.id] = 1; return { id: s.id, name: (s.name || "").trim() || "قسم" }; });
    mutate(function () {
      var s = state.settings;
      s.name = n; s.line1 = a; s.line2 = $("sL2").value.trim(); s.bio = $("sBio").value.trim();
      s.theme = selTheme; s.scale = parseFloat($("sScale").value) || 1;
      s.showDates = $("sDates").checked; s.showShare = $("sShare").checked;
      s.font = pickBody ? pickBody.value : ""; s.titleFont = pickTitle ? pickTitle.value : "";
      state.entries = state.entries.filter(function (e) { return keep[e.sec]; });
      state.sections = secs;
    });
    closeSheets(); toast("تم حفظ الإعدادات، اضغط «نشر» لتظهر للزوار");
  });
  $("setClose").addEventListener("click", closeSheets);
  $("setCancel").addEventListener("click", closeSheets);

  /* ---------- النشر ---------- */
  function buildHtml() {
    var s = state.settings;
    var head = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>' + esc(s.name) + '</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link id="font-ui" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap">\n';
    usedFonts().forEach(function (id) { head += '<link id="font-' + id + '" rel="stylesheet" href="' + esc(fontHref(FONT_BY[id])) + '">\n'; });
    var json = JSON.stringify(clone(state)).replace(/</g, "\\u003c");
    return '<!DOCTYPE html>\n<html lang="ar" dir="rtl" data-t="' + esc(s.theme) + '">\n<head>\n' + head +
      '<style id="css">' + document.getElementById("css").textContent + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
      '<template id="skeleton">' + document.getElementById("skeleton").innerHTML + '</template>\n\n' +
      '<script type="application/json" id="data">' + json + '</scr' + 'ipt>\n\n' +
      '<script id="app">' + document.getElementById("app").textContent + '</scr' + 'ipt>\n</body>\n</html>\n';
  }
  function updateStatus() {
    var dirty = state !== pub;
    $("dot").hidden = !dirty;
    $("pubStatus").textContent = dirty ? "لديك تعديلات لم تُنشر بعد. هي محفوظة على هذا الجهاز فقط ولا يراها الزوار." : "لا توجد تعديلات جديدة غير منشورة.";
  }
  function toB64(str) {
    var bytes = new TextEncoder().encode(str), bin = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function ghVerify(repo, tk) {
    return fetch("https://api.github.com/repos/" + repo, { headers: { "Authorization": "Bearer " + tk, "Accept": "application/vnd.github+json" } })
      .then(function (r) {
        if (r.status === 401) return { r: "bad" };
        if (r.status === 404 || r.status === 403) return { r: "nosite" };
        if (!r.ok) return { r: "err" };
        return r.json().then(function (j) { return (!j.permissions || j.permissions.push) ? { r: "ok", branch: j.default_branch || "main" } : { r: "noperm" }; });
      }).catch(function () { return { r: "net" }; });
  }
  var TK_MSG = {
    bad: "المفتاح غير صحيح أو منتهي.",
    nosite: "لم يُعثر على المستودع. تأكد من الاسم (اسم_المستخدم/اسم_المستودع) وأن المفتاح يشمله.",
    noperm: "المفتاح لا يملك صلاحية الكتابة. اجعل Contents: Read and write.",
    net: "تعذّر الاتصال بـ GitHub من المتصفح.",
    err: "تعذّر التحقق، حاول مرة أخرى."
  };
  function ghDeploy() {
    var cfg = getCfg(), html = buildHtml(), b64 = toB64(html);
    var url = "https://api.github.com/repos/" + cfg.repo + "/contents/index.html";
    var H = { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
    function getSha() {
      return fetch(url + "?ref=" + encodeURIComponent(cfg.branch || "main"), { headers: H }).then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) throw new Error("http " + r.status);
        return r.json().then(function (j) { return j.sha; });
      });
    }
    function put(sha) {
      var body = { message: "تحديث الموقع", content: b64, branch: cfg.branch || "main" };
      if (sha) body.sha = sha;
      return fetch(url, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, H), body: JSON.stringify(body) });
    }
    return getSha().then(put).then(function (r) {
      if (r.status === 409 || r.status === 422) return getSha().then(put);
      return r;
    }).then(function (r) { if (!r.ok) throw new Error("http " + r.status); });
  }
  function errMsg(e) {
    var m = (e && e.message) || "";
    if (/http 40[13]/.test(m)) return "المفتاح لا يملك صلاحية الكتابة في هذا المستودع.";
    if (/http 404/.test(m)) return "لم يُعثر على المستودع أو الفرع.";
    if (/http/.test(m)) return "رفض GitHub الطلب (" + m + ").";
    return "تعذّر الاتصال بـ GitHub.";
  }
  function deployNow() {
    if (busy) return;
    busy = true; toast("جارٍ النشر…");
    ghDeploy().then(function () {
      busy = false; toast("تم النشر، يظهر للزوار خلال دقيقة تقريبًا");
    }).catch(function (e) {
      busy = false; $("pubErr").textContent = errMsg(e); toast("تعذّر النشر المباشر");
      updateStatus(); openSheet("publish");
    });
  }
  function publishNow() {
    if (busy) return;
    busy = true; toast("جارٍ النشر…");
    art.publish(buildHtml()).catch(function (e) {
      busy = false;
      toast(e && e.code === "conflict" ? "تغيّرت الصفحة، أعد فتحها ثم حاول مرة أخرى" : "تعذّر النشر، حاول مرة أخرى");
    });
  }
  $("addBtn").addEventListener("click", function () { openEditor(null); });
  $("setBtn").addEventListener("click", openSettings);
  $("pubBtn").addEventListener("click", function () {
    if (state === pub) { toast("لا توجد تعديلات جديدة للنشر"); return; }
    if (art) { publishNow(); return; }
    if (getCfg()) { deployNow(); return; }
    $("pubErr").textContent = ""; updateStatus(); openSheet("publish");
  });
  $("pubClose").addEventListener("click", closeSheets);
  $("pubDownload").addEventListener("click", function () {
    try {
      var blob = new Blob([buildHtml()], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "index.html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast("جارٍ تنزيل الملف");
    } catch (e) { toast("تعذّر التنزيل، جرّب «نسخ الكود»"); }
  });
  $("pubCopy").addEventListener("click", function () { copyText(buildHtml()).then(function (ok) { toast(ok ? "تم نسخ الكود" : "تعذّر النسخ"); }); });
  var discArmed = false;
  $("pubDiscard").addEventListener("click", function () {
    var b = $("pubDiscard");
    if (!discArmed) { discArmed = true; b.textContent = "اضغط مرة أخرى للتأكيد"; setTimeout(function () { discArmed = false; b.textContent = "تجاهل التعديلات غير المنشورة"; }, 3000); return; }
    store.del(DRAFT_KEY); state = pub; closeSheets(); applySettings(); render(); updateStatus(); toast("تم تجاهل التعديلات");
  });
  $("pubExit").addEventListener("click", function () { store.del(ADMIN_KEY); location.reload(); });
  $("pubForget").addEventListener("click", function () { store.del(CFG_KEY); store.del(ADMIN_KEY); location.reload(); });

  /* ---------- الدخول (5 ضغطات على الاسم) ---------- */
  function enterAdmin() {
    if (inClaude) { store.set(ADMIN_KEY, "1"); location.reload(); return; }
    var c = getCfg();
    if (!c) {
      $("tkErr").textContent = "";
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split("/")[1];
        $("tkRepo").value = location.hostname.split(".")[0] + "/" + (seg || location.hostname);
      }
      openSheet("token"); return;
    }
    ghVerify(c.repo, c.token).then(function (v) {
      if (v.r === "ok") { store.set(ADMIN_KEY, "1"); location.reload(); return; }
      if (v.r !== "net") store.del(CFG_KEY);
      $("tkErr").textContent = TK_MSG[v.r] || ""; openSheet("token");
    });
  }
  $("tkGo").addEventListener("click", function () {
    var repo = $("tkRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/+$/, ""), tk = $("tkInput").value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $("tkErr").textContent = "اكتب اسم المستودع بصيغة: اسم_المستخدم/اسم_المستودع"; return; }
    if (!tk) { $("tkErr").textContent = "الصق المفتاح أولًا."; return; }
    var btn = $("tkGo"); btn.disabled = true; btn.textContent = "جارٍ التحقق…"; $("tkErr").textContent = "";
    ghVerify(repo, tk).then(function (v) {
      btn.disabled = false; btn.textContent = "تفعيل";
      if (v.r === "ok") { store.set(CFG_KEY, JSON.stringify({ repo: repo, token: tk, branch: v.branch })); store.set(ADMIN_KEY, "1"); location.reload(); }
      else $("tkErr").textContent = TK_MSG[v.r] || "تعذّر التحقق.";
    });
  });
  $("tkClose").addEventListener("click", closeSheets);
  var taps = 0, tapTimer;
  $("siteName").addEventListener("click", function () {
    if (admin) return;
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(function () { taps = 0; }, 2500);
    if (taps >= 5) { taps = 0; enterAdmin(); }
  });

  /* ---------- تشغيل ---------- */
  applySettings();
  render();
  updateStatus();
  route();
  window.addEventListener("hashchange", route);
  if (inClaude) {
    Promise.all([claude.use("artifact"), claude.use("user")]).then(function (r) {
      if (!r[0] || !r[1]) return;
      return r[1].isOwner().then(function (o) { if (o) art = r[0]; });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
